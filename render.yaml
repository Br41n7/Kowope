# Render Blueprint — deploys the full TradeAfric MVP stack in one pass:
# Postgres + Django/gunicorn backend + Next.js frontend, wired together.
#
# Deploy: push this repo to GitHub, then in the Render dashboard use
# "New > Blueprint" and point it at the repo. Render reads this file and
# creates everything below automatically.
#
# IMPORTANT — both services use a persistent-disk-free layout by default
# except the backend's media disk (see `disk:` below). Disks pin a service to
# a single instance: fine for an MVP pilot, but revisit before autoscaling
# (see PROJECT_STATUS.md §9 — move media to S3-compatible storage first).

databases:
  - name: tradeafric-db
    databaseName: tradeafric
    user: tradeafric
    plan: starter  # swap to "free" for a throwaway test deploy — Render's free Postgres expires after 30 days

services:
  - type: web
    name: tradeafric-backend
    runtime: docker
    plan: starter  # swap to "free" for testing — free web services spin down after inactivity (~50s cold start)
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    disk:
      name: tradeafric-media
      mountPath: /app/media
      sizeGB: 1
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "False"
      - key: PORT
        value: "8000"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tradeafric-db
          property: connectionString
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: tradeafric-backend
          property: host
      - key: SECURE_SSL_REDIRECT
        value: "True"

  - type: web
    name: tradeafric-frontend
    runtime: docker
    plan: starter
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: PORT
        value: "3000"
      # Pulls the backend service's own full external URL (e.g.
      # https://tradeafric-backend.onrender.com) — this is what the Next.js
      # server proxies /api and /media to. See next.config.ts.
      - key: BACKEND_INTERNAL_URL
        fromService:
          type: web
          name: tradeafric-backend
          envVarKey: RENDER_EXTERNAL_URL
